<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <!-- Main vibrant cyan to azure gradient -->
    <linearGradient id="brandGradientMain" x1="100" y1="15" x2="100" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="25%" stop-color="#2dd4bf" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Top Cap gradient -->
    <linearGradient id="topCapGrad" x1="100" y1="15" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Left Leg gradient -->
    <linearGradient id="leftLegGrad" x1="20" y1="95" x2="80" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Right Leg gradient -->
    <linearGradient id="rightLegGrad" x1="180" y1="95" x2="120" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Facet Shadow gradient for 3D crystal depth -->
    <linearGradient id="facetShadowLeft" x1="75" y1="110" x2="55" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="facetShadowRight" x1="125" y1="110" x2="145" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Center Node sphere gradient -->
    <radialGradient id="sphereGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </radialGradient>

    <!-- Glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Top Chevron / Peak Element -->
  <path
    d="M 100 16 
       L 142 88 
       L 124 106 
       L 100 76 
       L 76 106 
       L 58 88 
       Z"
    fill="url(#topCapGrad)"
  />

  <!-- 2. Left Diagonal Wing -->
  <path
    d="M 52 98 
       L 72 118 
       L 34 218 
       L 10 192 
       Z"
    fill="url(#leftLegGrad)"
  />
  <!-- Left Leg 3D Facet Bevel -->
  <path
    d="M 72 118 
       L 52 98 
       L 62 145 
       Z"
    fill="url(#facetShadowLeft)"
  />

  <!-- 3. Right Diagonal Wing -->
  <path
    d="M 148 98 
       L 190 192 
       L 166 218 
       L 128 118 
       Z"
    fill="url(#rightLegGrad)"
  />
  <!-- Right Leg 3D Facet Bevel -->
  <path
    d="M 128 118 
       L 148 98 
       L 138 145 
       Z"
    fill="url(#facetShadowRight)"
  />

  <!-- 4. Central Glowing Sphere / Node -->
  <circle
    cx="100"
    cy="182"
    r="24"
    fill="url(#sphereGrad)"
  />
</svg>
